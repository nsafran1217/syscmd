# Driver definition for the APC AP7900 family (rPDU, MasterSwitch).
# "{outlet}" is replaced with the outlet number at request time.
name: APC AP7900

snmp:
  version: v1

outlets:
  stateOid: "1.3.6.1.4.1.318.1.1.4.4.2.1.3.{outlet}"
  controlOid: "1.3.6.1.4.1.318.1.1.4.4.2.1.3.{outlet}"
  nameOid: "1.3.6.1.4.1.318.1.1.4.4.2.1.4.{outlet}"

  # Value written to controlOid for each action.
  commands:
    on: 1
    off: 2
    reboot: 3

  # Value read back from stateOid, mapped to a power state.
  stateMap:
    1: on
    2: off
    3: off

power:
  # rPDUIdentDeviceLinePhaseLoad - whole-unit current in tenths of an amp.
  loadOid: "1.3.6.1.4.1.318.1.1.12.2.3.1.1.2.1"
  loadUnit: deciamps
  nominalVolts: 120
  # Set this on metered models to get per-outlet wattage.
  perOutletWattsOid: null
