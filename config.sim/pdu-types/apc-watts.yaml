# Same simulated PDU read through a watts load OID instead of a current one, mirroring the
# AP89xx family. Used to check that the watts path scales correctly end to end.
name: APC (watts reading)

snmp:
  version: v1

outlets:
  stateOid: "1.3.6.1.4.1.318.1.1.4.4.2.1.3.{outlet}"
  controlOid: "1.3.6.1.4.1.318.1.1.4.4.2.1.3.{outlet}"
  nameOid: "1.3.6.1.4.1.318.1.1.4.4.2.1.4.{outlet}"
  commands:
    on: 1
    off: 2
    reboot: 3
  stateMap:
    1: on
    2: off

power:
  # rPDUIdentDevicePowerWatts - already whole watts, so no conversion is needed.
  loadOid: "1.3.6.1.4.1.318.1.1.12.1.16.0"
  loadUnit: watts
  # Only used to derive amps from the watts reading.
  nominalVolts: 240
  perOutletWattsOid: null
