# Global settings. Everything here is editable from the GUI under Configuration.
site:
  name: Simulated Lab
  # Default CDE palette and backdrop, by file name under wwwroot/cde/. A browser that picks its
  # own on the Appearance page overrides these; everyone else, and every first visit, gets them.
  theme: Default
  backdrop: Toronto
  # Which colour set tints the backdrop. dtwm cycles workspaces through 3, 5, 6 and 7.
  backdropColorSet: 3
  # Palettes a browser set to "random" draws from. Empty means any of them.
  randomThemes: []

power:
  # How often every PDU is polled for its load reading.
  pollIntervalSeconds: 15
  # Used to turn kWh into money on the status overview.
  costPerKwh: 0.14
  currency: USD

orchestration:
  # Pause after switching an outlet on before probing the management processor.
  outletSettleSeconds: 3
  # How long to wait for an MP to answer after outlet power is applied.
  powerOnMpTimeoutSeconds: 90
  # How long to wait for a machine to confirm it is off. On timeout the outlet is LEFT ON.
  powerOffConfirmTimeoutSeconds: 90
  powerOffPollIntervalSeconds: 8
