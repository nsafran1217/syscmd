# Global settings. Also editable from the GUI under Configuration.
site:
  name: Home Lab
  # Default CDE palette and backdrop, by file name under wwwroot/cde/. A browser that picks its
  # own on the Appearance page overrides these; everyone else, and every first visit, gets them.
  theme: Default
  backdrop: Toronto
  # Which colour set tints the backdrop. dtwm cycles workspaces through 3, 5, 6 and 7.
  backdropColorSet: 3
  # Palettes a browser set to "random" draws from. Empty means any of them.
  randomThemes: []

power:
  # How often every PDU is polled for its load reading.
  pollIntervalSeconds: 30
  # Your electricity rate, used for the cost figures on the status overview.
  costPerKwh: 0.14
  currency: USD

orchestration:
  # Pause after switching an outlet on before probing the management processor.
  outletSettleSeconds: 5
  # How long to wait for an MP to answer after outlet power is applied.
  # Vintage service processors can take a couple of minutes to boot.
  powerOnMpTimeoutSeconds: 180
  # How long to wait for a machine to confirm it is powered down.
  # If this expires the outlet is deliberately LEFT ON and the job fails.
  powerOffConfirmTimeoutSeconds: 300
  powerOffPollIntervalSeconds: 10
