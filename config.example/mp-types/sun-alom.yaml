# Sun Advanced Lights Out Manager (ALOM) - a flat "sc>" shell rather than nested menus.
name: Sun ALOM
transport: telnet
defaultPort: 23

# Whether the MP tolerates more than one login at once. Only consulted for a direct address:
# reached through a console server it is one serial wire whatever is on the end of it.
allowsConcurrentSessions: true

timeouts:
  expectSeconds: 20
  connectSeconds: 10

prompt: "sc>"

login:
  - expect: "login:"
    send: "{username}"
  - expect: "password:"
    send: "{password}"

tasks:
  poweron:
    - expect: "sc>"
      send: "poweron"
    - expect: "sc>"

  # -y answers the confirmation prompt; add -f for a hard cut instead of a graceful shutdown.
  poweroff:
    - expect: "sc>"
      send: "poweroff -y"
    - expect: "sc>"
      timeoutSeconds: 60

  reset:
    - expect: "sc>"
      send: "reset -y"
    - expect: "sc>"
      timeoutSeconds: 60

  status:
    - expect: "sc>"
      send: "showplatform"
    - expect: "sc>"
      match:
        on: "/Reset/i"
        off: "/powered off|standby/i"

logout:
  - send: "logout"
