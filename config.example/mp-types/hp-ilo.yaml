# HP iLO 2/3 on ProLiant hardware, over its SSH-style text menu exposed on telnet.
# iLO also speaks Redfish over HTTPS; that would need a coded driver rather than this
# script, which is exactly what the IMpDriver interface leaves room for.
name: HP iLO (telnet)
transport: telnet
defaultPort: 23

# iLO handles concurrent sessions, so a console window open on it does not block a power job.
allowsConcurrentSessions: true

timeouts:
  expectSeconds: 25
  connectSeconds: 10

prompt: "hpiLO->"

login:
  - expect: "login:"
    send: "{username}"
  - expect: "password:"
    send: "{password}"

tasks:
  poweron:
    - expect: "hpiLO->"
      send: "power on"
    - expect: "hpiLO->"

  poweroff:
    - expect: "hpiLO->"
      send: "power off"
    - expect: "hpiLO->"
      timeoutSeconds: 60

  reset:
    - expect: "hpiLO->"
      send: "power reset"
    - expect: "hpiLO->"

  # Bare "power" prints the current state; the next prompt is what carries it back.
  status:
    - expect: "hpiLO->"
      send: "power"
    - expect: "hpiLO->"
      match:
        on: "/power: server power is currently: On/i"
        off: "/power: server power is currently: Off/i"

logout:
  - send: "exit"
