# HP Integrity Management Processor (MP / iLO for Integrity/rp series).
#
# Script syntax:
#   expect  - substring to wait for, or /regex/ with optional i, m, s flags
#   send    - text to transmit; a carriage return is appended unless noNewline is set.
#             Supports {username}, {password}, \r \n \t \e \xNN and ^X control escapes.
#   match   - on a step, tests the output that arrived while waiting for its expect,
#             and reports the machine's power state. Only the "status" task needs this.
#
# syscmd runs four tasks: poweron, poweroff, reset and status. Define the ones this model of
# service processor actually has and leave the rest out - a missing task disables that operation
# and greys it out in the GUI, which is a normal thing for a file to say. Do not write a task key
# with nothing under it: that is reported as an error, because it reads as an unfinished edit
# rather than a decision. See ibm-p7.yaml for a model that can only start a machine.
name: HP Integrity/rp MP
transport: telnet
defaultPort: 23
allowsConcurrentSessions: true

timeouts:
  expectSeconds: 20
  connectSeconds: 10

# The MP's idle prompt, for reference and for the GUI to display.
prompt: "MP>"

login:
  - expect: "MP login:"
    send: "{username}"
  - expect: "MP password:"
    send: "{password}"

tasks:
  # "cm" enters the command menu, "pc" is power control, "ma" returns to the main menu.
  poweron:
    - expect: "MP>"
      send: "cm"
    - expect: "MP:CM>"
      send: "pc"
    - expect: "Quit:"
      send: "on"
    - expect: "(Y/"
      send: "y"
    - expect: "MP:CM>"
      send: "ma"

  # "off" is a hard power cut; "g" asks for a graceful shutdown on MPs that offer it.
  poweroff:
    - expect: "MP>"
      send: "cm"
    - expect: "MP:CM>"
      send: "pc"
    - expect: "Quit:"
      send: "off"
    - expect: "(Y/"
      send: "y"
    - expect: "MP:CM>"
      send: "ma"

  reset:
    - expect: "MP>"
      send: "cm"
    - expect: "MP:CM>"
      send: "pc"
    - expect: "Quit:"
      send: "c"
    - expect: "(Y/"
      send: "y"
    - expect: "MP:CM>"
      send: "ma"

  status:
    - expect: "MP>"
      send: "cm"
    - expect: "MP:CM>"
      send: "ps"
    # Waiting for the prompt after "ps" captures the power line it printed on the way.
    - expect: "MP:CM>"
      match:
        on: "/System Power[^:]*:\\s*on/i"
        off: "/System Power[^:]*:\\s*off/i"
      send: "ma"

logout:
  - send: "x"
