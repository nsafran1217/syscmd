# syscmd under Compose.
#
#   docker compose up -d                      real hardware, reading ./docker/config
#   docker compose --profile sim up           the fake lab, no config and no volumes needed
#
# Settings worth putting in a .env beside this file:
#   SYSCMD_PORT=5080
#   SYSCMD_UID=1000        # id -u
#   SYSCMD_GID=1000        # id -g
#   TZ=America/Toronto

services:
  syscmd:
    build: .
    image: syscmd
    container_name: syscmd
    restart: unless-stopped
    ports:
      - "${SYSCMD_PORT:-5080}:5080"


    user: "${SYSCMD_UID:-1000}:${SYSCMD_GID:-1000}"

    volumes:
      - /dockerdata/syscmd/config:/app/config
      - /dockerdata/syscmd/data:/app/data

    environment:
      # A container is UTC, which makes the event log's timestamps confusing next to the lab's.
      TZ: ${TZ:-UTC}
      # ASP.NET keeps its data-protection keys under $HOME. With a uid that has no home directory
      # they would be held in memory and regenerated on every restart, which invalidates the
      # antiforgery tokens on any page still open. Pointing HOME at the mounted data directory
      # keeps them with the rest of the runtime state.
      HOME: /app/data
